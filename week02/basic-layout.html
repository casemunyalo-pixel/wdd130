<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="This is a basic HTML structure example using semantic HTML elements.">
    <meta name="author" content="Case Munyalo">
</head>
<body>
    <header>
        <img src="images/basic-logo.png" alt="Basic HTML Structure Logo" width="128" height="128">

    </header>
    <nav>
        <ul>
            <li><a href="https://byui.edu">BYU-Idaho</a></li>
            <li><a href="https://churchofjesuschrist.org">The Church of Jesus Christ of Latter-day Saints</a></li>
        </ul>

    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading </h2>
            <p>This is a simple paragraph within the section.</p>
        </section>
        <section>
            <h2>Another Heading</h2>
            <p>This is another paragraph within a different section.</p>
    </main>
    <aside>
        <img src="images/abidjan-ivory-coast.jpeg" alt="Abidjan, Ivory Coast" width="200" height="200">
    </aside>
    <footer>
        <p>© 2023 💠 Case Munyalo 💠 Nairobi, Kenya.</p>
    </footer>
    
</body>
</html>
